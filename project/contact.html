<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asia Travel Explorer | Product Review Travel Planner</title>
    <meta name="description"
        content="Use the Asia Travel Explorer planner to review destinations and receive a personalized travel recommendation.">
    <meta name="author" content="Aine Villegas">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/scripts.js" defer></script>
</head>

<body>
    <header>
        <h1>Asia Travel Explorer</h1>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="destinations.html">Destinations</a>
            <a href="contact.html">Travel Planner</a>
            <a href="references.html">References</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Travel Planner Product Review</h2>

            <p>Fill in your details to receive a recommended destination and estimated travel cost.</p>

            <form id="contactForm" method="get" action="review.html">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="destinationSelect">Select Destination Product</label>
                <select id="destinationSelect" name="destinationSelect" required>
                    <option value="" disabled selected>Select a Product ...</option>
                    <option value="japan">Japan Travel Review</option>
                    <option value="korea">South Korea Travel Review</option>
                    <option value="thailand">Thailand Travel Review</option>
                    <option value="philippines">Philippines Travel Review</option>
                </select>

                <label for="budget">Budget Level</label>
                <select id="budget" name="budget" required>
                    <option value="" disabled selected>Select a Product ...</option>
                    <option value="low">Low Budget</option>
                    <option value="medium">Medium Budget</option>
                    <option value="high">High Budget</option>
                </select>

                <fieldset>
                    <legend>Trip Type</legend>

                    <label for="culture">
                        <input type="radio" id="culture" name="tripType" value="culture" required>
                        Culture
                    </label>

                    <label for="food">
                        <input type="radio" id="food" name="tripType" value="food" required>
                        Food
                    </label>

                    <label for="beach">
                        <input type="radio" id="beach" name="tripType" value="beach" required>
                        Beach
                    </label>

                    <label for="adventure">
                        <input type="radio" id="adventure" name="tripType" value="adventure" required>
                        Adventure
                    </label>

                    <label for="city">
                        <input type="radio" id="city" name="tripType" value="city" required>
                        City Tour
                    </label>
                </fieldset>

                <label for="travelDate">Preferred Travel Date</label>
                <input type="date" id="travelDate" name="travelDate" required>

                <fieldset>
                    <legend>Travel Add-ons</legend>

                    <label for="hotel">
                        <input type="checkbox" id="hotel" name="addons" value="hotel">
                        Hotel
                    </label>

                    <label for="meals">
                        <input type="checkbox" id="meals" name="addons" value="meals">
                        Meals
                    </label>

                    <label for="tourGuide">
                        <input type="checkbox" id="tourGuide" name="addons" value="tourGuide">
                        Tour Guide
                    </label>

                    <label for="transport">
                        <input type="checkbox" id="transport" name="addons" value="transport">
                        Transportation
                    </label>
                </fieldset>

                <label for="days">Number of Days</label>
                <input type="number" id="days" name="days" min="1" required>

                <label for="people">Number of Travelers</label>
                <input type="number" id="people" name="people" min="1" required>

                <label for="message">Additional Notes</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Get Travel Plan</button>
            </form>

            <section id="responseMessage" class="response-box"></section>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Asia Travel Explorer | Aine Villegas | <a href="references.html">References</a></p>
    </footer>
</body>

</html>
