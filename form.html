<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Submit your product review including ratings, installation date, useful features, and feedback using this interactive form.">
    <meta name="author" content="Lolilaine S. Curro-Villegas">

    <title>Product Review</title>

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <!-- PRODUCT -->
            <label for="product">Product Name:</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <!-- RATING -->
            <fieldset>
                <legend>Overall Rating:</legend>

                <label for="r1">
                    <input type="radio" id="r1" name="rating" value="1" required> ★
                </label>

                <label for="r2">
                    <input type="radio" id="r2" name="rating" value="2" required> ★★
                </label>

                <label for="r3">
                    <input type="radio" id="r3" name="rating" value="3" required> ★★★
                </label>

                <label for="r4">
                    <input type="radio" id="r4" name="rating" value="4" required> ★★★★
                </label>

                <label for="r5">
                    <input type="radio" id="r5" name="rating" value="5" required> ★★★★★
                </label>
            </fieldset>

            <!-- DATE -->
            <label for="installDate">Date of Installation:</label>
            <input type="date" id="installDate" name="installDate" required>

            <!-- FEATURES -->
            <fieldset>
                <legend>Useful Features:</legend>

                <label for="f1">
                    <input type="checkbox" id="f1" name="features" value="Durable"> Durable
                </label>

                <label for="f2">
                    <input type="checkbox" id="f2" name="features" value="Easy Use"> Easy Use
                </label>

                <label for="f3">
                    <input type="checkbox" id="f3" name="features" value="Affordable"> Affordable
                </label>

                <label for="f4">
                    <input type="checkbox" id="f4" name="features" value="High Quality"> High Quality
                </label>
            </fieldset>

            <!-- REVIEW -->
            <label for="review">Written Review:</label>
            <textarea id="review" name="review"></textarea>

            <!-- NAME -->
            <label for="username">Your Name:</label>
            <input type="text" id="username" name="username">

            <!-- SUBMIT -->
            <input type="submit" value="Submit Review">

        </form>
    </main>

    <footer>
        <p>&copy; 2026 | Aine Villegas, Philippines </p>
    </footer>

</body>

</html>
