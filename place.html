<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ✅ META -->
    <meta name="description" content="Explore Switzerland's Alps, scenic landscapes, and weather conditions.">
    <meta name="author" content="Lolilaine S. Curro-Villegas">

    <title>Switzerland | Place Page</title>

    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>
</head>

<body>

    <header>
        <h1>Switzerland</h1>
    </header>

    <main>

        <!-- ✅ HERO -->
        <div class="hero">
            <picture>
                <source srcset="images/swiss2.webp" media="(min-width: 1000px)">
                <source srcset="images/swiss3.webp" media="(min-width: 500px)">
                <img src="images/swiss1.webp" alt="Swiss Alps landscape" width="1500" height="750">
            </picture>
        </div>

        <!-- ✅ INFO -->
        <section class="info">
            <h2>About Switzerland</h2>
            <p>
                Switzerland is known for its Alps, lakes, and outdoor lifestyle.
                It is a destination for skiing, hiking, and scenic travel.
            </p>
        </section>

        <!-- ✅ WEATHER -->
        <section class="weather">
            <h2>Weather</h2>

            <div class="weather-content">
                <img src="images/weather.svg" alt="Weather icon" class="weather-icon" width="60" height="60">

                <p><strong>Temperature:</strong> <span id="temp">8</span> °C</p>
                <p><strong>Wind Speed:</strong> <span id="wind">10</span> km/h</p>
                <p><strong>Wind Chill:</strong> <span id="windchill"></span></p>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; <span id="year"></span> Aine Villegas, Philippines | Last Modified: <span id="modified"></span></p>
    </footer>

</body>

</html>
